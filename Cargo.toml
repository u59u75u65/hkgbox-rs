[package]

name = "hkg"
version = "1.1.0"
authors = [ "u59u75u65" ]
edition = "2021"

[dependencies]
# HTTP client - async with blocking support for transition
reqwest = { version = "0.12", features = ["blocking", "json"] }
# Async runtime
tokio = { version = "1.40", features = ["full"] }

# HTML parsing
kuchiki = "0.8"

# JSON serialization - replacing rustc-serialize
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Base64 encoding - replacing rustc-serialize
base64 = "0.22"

# Date/time
chrono = "0.4"

# Regular expressions
regex = "1.11"

# Cancellation - modern alternative
tokio-util = "0.7"

# Terminal handling
termion = "4.0"

# Time handling
time = "0.3"

# Logging
log = "0.4"
log4rs = "1.3"

# Concurrency utilities
crossbeam = "0.8"

# URL parsing
url = "2.5"

# Error handling
thiserror = "2.0"

[dev-dependencies]
# Mocking support for testing
mockall = "0.13"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bin]]
name = "hkg"
path = "src/main.rs"
